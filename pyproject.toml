[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamlit-net-bars"
version = "0.1.0"
description = "Clickable diverging bars with a live net line for Streamlit"
requires-python = ">=3.10"
dependencies = ["streamlit>=1.51,<2"]

[tool.setuptools.packages.find]
include = ["streamlit_net_bars*"]

[tool.setuptools.package-data]
streamlit_net_bars = ["frontend/*.js", "frontend/*.css"]
