[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "interactive-streamlit-bar-plot"
version = "0.2.0"
description = "Streamlit Interactive Charts: net bars, Marimekko, horizon, paired-change and UpSet plots"
readme = "README.md"
authors = [{name = "John Della Rosa"}]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["streamlit>=1.51,<2"]
keywords = ["streamlit", "component", "interactive-charts", "visualization", "upset", "marimekko", "horizon"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.urls]
Repository = "https://github.com/johndellarosa/interactive-streamlit-bar-plot"
Issues = "https://github.com/johndellarosa/interactive-streamlit-bar-plot/issues"

[project.optional-dependencies]
release = ["build>=1.2", "twine>=6"]

[tool.setuptools.packages.find]
include = ["streamlit_interactive_charts*", "streamlit_net_bars*"]

[tool.setuptools.package-data]
streamlit_net_bars = ["frontend/*.js", "frontend/*.css"]
