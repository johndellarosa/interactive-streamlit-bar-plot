name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Release tag must match pyproject.toml version'
          PY
      - name: Install project and release tools
        run: python -m pip install '.[release]'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Test chart calculations
        run: node --test tests/test_axis.mjs tests/test_marimekko.mjs tests/test_horizon.mjs tests/test_paired_change.mjs tests/test_upset.mjs tests/test_raincloud.mjs tests/test_bump.mjs tests/test_lasagna.mjs tests/test_box.mjs tests/test_histogram.mjs tests/test_nice_axes.mjs tests/test_waterfall.mjs tests/test_bullet.mjs tests/test_sequence.mjs tests/test_ridgeline.mjs
      - name: Build wheel and source archive
        run: python -m build
      - name: Check PyPI metadata and README
        run: python -m twine check --strict dist/*
      - name: Verify wheel contains frontend assets and license
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile(next(Path('dist').glob('*.whl'))) as wheel:
              files = wheel.namelist()
              assert 'streamlit_net_bars/frontend/axes.js' in files
              assert 'streamlit_interactive_charts/__init__.py' in files
              assert 'streamlit_interactive_charts/upset.py' in files
              assert 'streamlit_net_bars/frontend/chart.js' in files
              assert 'streamlit_net_bars/frontend/chart.css' in files
              assert 'streamlit_net_bars/frontend/marimekko.js' in files
              assert 'streamlit_net_bars/frontend/marimekko.css' in files
              assert 'streamlit_net_bars/frontend/horizon.js' in files
              assert 'streamlit_net_bars/frontend/horizon.css' in files
              assert 'streamlit_net_bars/frontend/paired_change.js' in files
              assert 'streamlit_net_bars/frontend/paired_change.css' in files
              assert 'streamlit_net_bars/frontend/upset.js' in files
              assert 'streamlit_net_bars/frontend/upset.css' in files
              assert 'streamlit_net_bars/frontend/raincloud.js' in files
              assert 'streamlit_net_bars/frontend/raincloud.css' in files
              assert 'streamlit_net_bars/frontend/bump.js' in files
              assert 'streamlit_net_bars/frontend/bump.css' in files
              assert 'streamlit_net_bars/frontend/lasagna.js' in files
              assert 'streamlit_net_bars/frontend/lasagna.css' in files
              assert 'streamlit_net_bars/frontend/box.js' in files
              assert 'streamlit_net_bars/frontend/box.css' in files
              assert 'streamlit_net_bars/frontend/histogram.js' in files
              assert 'streamlit_net_bars/frontend/histogram.css' in files
              assert 'streamlit_net_bars/frontend/waterfall.js' in files
              assert 'streamlit_net_bars/frontend/waterfall.css' in files
              assert 'streamlit_net_bars/frontend/bullet.js' in files
              assert 'streamlit_net_bars/frontend/bullet.css' in files
              assert 'streamlit_net_bars/frontend/sequence.js' in files
              assert 'streamlit_net_bars/frontend/sequence.css' in files
              assert 'streamlit_net_bars/frontend/distribution.js' in files
              assert 'streamlit_net_bars/frontend/ridgeline.js' in files
              assert 'streamlit_net_bars/frontend/ridgeline.css' in files
              assert 'streamlit_interactive_charts/ridgeline.py' in files
              assert 'streamlit_interactive_charts/bullet.py' in files
              assert 'streamlit_interactive_charts/sequence.py' in files
              assert 'streamlit_interactive_charts/waterfall.py' in files
              assert 'streamlit_interactive_charts/histogram.py' in files
              assert 'streamlit_interactive_charts/box.py' in files
              assert 'streamlit_interactive_charts/lasagna.py' in files
              assert 'streamlit_interactive_charts/bump.py' in files
              assert 'streamlit_interactive_charts/raincloud.py' in files
              assert any(f.endswith('.dist-info/licenses/LICENSE') for f in files)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/interactive-streamlit-bar-plot/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
