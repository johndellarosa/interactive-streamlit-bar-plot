name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Release tag must match pyproject.toml version'
          PY
      - name: Install project and release tools
        run: python -m pip install '.[release]'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Test chart axis calculations
        run: node --test tests/test_axis.mjs
      - name: Build wheel and source archive
        run: python -m build
      - name: Check PyPI metadata and README
        run: python -m twine check --strict dist/*
      - name: Verify wheel contains frontend assets and license
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          with ZipFile(next(Path('dist').glob('*.whl'))) as wheel:
              files = wheel.namelist()
              assert 'streamlit_net_bars/frontend/chart.js' in files
              assert 'streamlit_net_bars/frontend/chart.css' in files
              assert any(f.endswith('.dist-info/licenses/LICENSE') for f in files)
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/interactive-streamlit-bar-plot/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: python-distributions
          path: dist/
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
